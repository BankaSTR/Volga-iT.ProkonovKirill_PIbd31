name: UI tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ui-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m pytest --collect-only -q

  selenium:
    name: Python 3.12 / ${{ matrix.browser }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, firefox]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install dependencies and Allure CLI
        run: |
          python -m pip install -r requirements.txt
          npm install --global allure-commandline@2.34.1
      - name: Run UI tests
        run: >-
          python -m pytest --browser=${{ matrix.browser }} -n 2 --dist=loadfile
          --junitxml=artifacts/junit.xml
      - name: Generate Allure report even on test failure
        if: always()
        run: allure generate allure-results --clean -o allure-report
      - name: Upload reports and failure screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ matrix.browser }}
          path: |
            allure-results/
            allure-report/
            artifacts/
          retention-days: 14
